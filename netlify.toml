[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Security Headers for Google OAuth Verification
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=(self)"
    Cache-Control = "public, max-age=3600"

# Los HTML nunca se cachean: son los que apuntan a los bundles con hash.
# Si se cachean, el navegador sigue pidiendo el bundle viejo (que además es
# immutable) y los deploys nuevos no se ven nunca.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/room/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Los assets sí llevan hash en el nombre, así que se pueden cachear a largo plazo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# App entry point (React) — must come before the landing catch-all
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# The app owns /room/:slug (invite links, active sessions)
[[redirects]]
  from = "/room/*"
  to = "/app/index.html"
  status = 200

# Everything else falls back to the landing page
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
